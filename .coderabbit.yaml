# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "ko-KR"
tone_instructions: "구체적이고 실행 가능한 피드백을 제공하세요. 프로젝트 컨벤션 위반 시 명확하게 지적하고 올바른 패턴을 제시하세요."
early_access: false

reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_in_walkthrough: false
  poem: false
  review_status: true
  collapse_walkthrough: false
  sequence_diagrams: true
  estimate_code_review_effort: true
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_labels: true
  auto_apply_labels: false
  suggested_reviewers: true

  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
    base_branches:
      - "develop"
      - "main"
    ignore_title_keywords:
      - "WIP"
      - "[WIP]"
      - "DO NOT MERGE"

  labeling_instructions:
    - label: "feat"
      instructions: "새로운 기능이 추가된 PR"
    - label: "fix"
      instructions: "버그를 수정하는 PR"
    - label: "refactor"
      instructions: "기능 변경 없이 코드 구조를 개선하는 PR"
    - label: "chore"
      instructions: "빌드 설정, 패키지 관리, CI 수정 등 PR"
    - label: "docs"
      instructions: "문서를 추가하거나 수정하는 PR"
    - label: "test"
      instructions: "테스트 코드를 추가하거나 수정하는 PR"

  path_filters:
    - "!**/node_modules/**"
    - "!**/.next/**"
    - "!**/dist/**"
    - "!**/.expo/**"
    - "!**/build/**"
    - "!**/coverage/**"
    - "!**/*.lock"
    - "!**/.turbo/**"

  path_instructions:
    - path: "apps/api/src/**/*.ts"
      instructions: |
        NestJS 백엔드 코드 리뷰 기준:

        [모듈 구조]
        - Controller → Service → PrismaService 계층을 엄격히 준수하는지 확인
        - 별도 Repository 클래스 생성 금지: Service가 PrismaService를 직접 주입받아야 함
        - Controller는 요청/응답 처리만 담당; 비즈니스 로직은 반드시 Service에 위치
        - 다른 모듈의 Service를 직접 import 금지; 해당 Module을 exports에 노출한 뒤 Module 단위로 import

        [Prisma 사용]
        - apps/api 내부에 Prisma 관련 파일(schema, migration, seed) 직접 생성 금지
        - packages/database에서 export하는 DatabaseModule만 AppModule에 import
        - 모든 조회 쿼리에 `deletedAt: null` 필터 기본 포함 (소프트 딜리트 원칙)
        - Prisma 생성 타입을 그대로 사용; 별도 타입 재정의 금지

        [인증 및 인가]
        - 관리자 전용 엔드포인트: @Roles('ADMIN') 가드 적용 여부 확인
        - 근로자 전용 엔드포인트: @Roles('WORKER') 가드 적용 여부 확인
        - JWT Access Token 유효기간 15분, Refresh Token 7일 HTTP-only 쿠키 방식 준수 확인

        [유효성 검증]
        - 모든 DTO에 class-validator + class-transformer 데코레이터 사용
        - 전역 ValidationPipe: whitelist: true, forbidNonWhitelisted: true 옵션 설정 확인

        [에러 응답]
        - 에러 응답 형식 준수 여부 확인: { statusCode, errorCode, message }
        - errorCode는 반드시 common/constants/error-codes.ts 상수 사용; 하드코딩 금지

        [API 문서화]
        - 모든 Controller에 @ApiTags, @ApiOperation, @ApiResponse 데코레이터 필수
        - 모든 DTO 필드에 @ApiProperty 데코레이터 필수

        [데이터 보존]
        - 근태·급여 데이터 실제 삭제 로직 구현 금지 (근로기준법 3년 보존 원칙)
        - 탈퇴 처리는 anonymize() 방식으로만 구현

        [스케줄 자동화]
        - Cron 표현식은 상수로 분리하여 관리 (인라인 하드코딩 금지)
        - 퇴근 미처리 자동화는 AttendanceScheduler에서만 처리

    - path: "apps/api/src/**/*.spec.ts"
      instructions: |
        NestJS 단위 테스트 리뷰 기준:
        - PrismaService는 반드시 mockDeep<PrismaClient>()로 모킹
        - NestJS TestingModule을 통한 의존성 주입 방식 사용 확인
        - describe/it 블록 명칭이 테스트 의도를 명확히 표현하는지 확인
        - Service 레이어 커버리지 목표 80% 이상 달성 가능한 구조인지 확인

    - path: "apps/api/test/**/*.ts"
      instructions: |
        E2E 테스트 리뷰 기준:
        - DATABASE_URL_TEST 환경 변수 사용 확인 (프로덕션 DB 사용 금지)
        - 각 테스트 전후 DB 초기화 로직 포함 여부 확인
        - Supertest를 이용한 HTTP 요청 방식 사용 확인

    - path: "apps/web/**/*.tsx"
      instructions: |
        Next.js 관리자 웹 컴포넌트 리뷰 기준:

        [라우팅 및 렌더링]
        - pages/ 디렉터리 사용 금지; App Router(app/)만 허용
        - "use client" 선언은 필요한 최소 범위에만 적용
        - 초기 데이터 로드는 서버 컴포넌트(RSC)에서 처리; 이후 인터랙션은 TanStack Query

        [상태 관리]
        - 서버 데이터는 반드시 TanStack Query 사용 (Zustand에 서버 데이터 저장 금지)
        - UI 전역 상태(필터 조건, 선택된 조직 ID, 모달 상태 등)만 Zustand 사용
        - 두 상태 혼용 즉시 지적

        [폼 및 유효성 검증]
        - 모든 폼은 React Hook Form + Zod 조합 사용
        - Zod 스키마는 packages/shared에서 import; 웹 내부 별도 정의 금지

        [스타일링]
        - Tailwind CSS 유틸리티 클래스만 사용; 인라인 style 속성 금지
        - StyleSheet 사용 금지 (React Native 전용 API)

        [인증]
        - JWT는 HTTP-only 쿠키에 저장; localStorage 저장 절대 금지
        - 미인증 접근 처리는 Next.js middleware에서 처리

        [UI 컴포넌트]
        - shadcn/ui 소스 복사(components/ui/) 방식 사용; npm 패키지 직접 import 금지
        - shadcn/ui 컴포넌트는 components/ui/ 내에서 직접 수정하여 커스터마이징
        - 도메인 특화 컴포넌트(스케줄 캘린더, 근태 타임라인 등)는 components/features/ 위치

        [에러 처리]
        - API 에러는 TanStack Query onError 또는 error boundary에서 처리

    - path: "apps/web/**/*.ts"
      instructions: |
        Next.js 웹 TypeScript 코드 리뷰 기준:
        - any 타입 사용 자제; 구체적인 타입 또는 packages/shared 타입 사용
        - API 요청/응답 타입은 packages/shared/src/types/api/에서 import

    - path: "apps/mobile/**/*.tsx"
      instructions: |
        Expo React Native 모바일 앱 컴포넌트 리뷰 기준:

        [스타일링]
        - StyleSheet 직접 작성 금지; NativeWind 4.x 클래스만 사용
        - 웹 전용 클래스 사용 금지: hover:, group-, CSS Grid 관련 클래스
        - 허용 클래스: flex, gap, p-, m-, 타이포그래피, 색상

        [UI 컴포넌트]
        - 기본 UI (Button, Input, Alert, Card, Toast)는 Gluestack UI v3 래퍼(`src/components/ui`) 사용
        - `@gluestack-ui/core` creator import는 `src/components/ui` 내부에서만 허용
        - Gluestack 컴포넌트 직접 수정 금지; 커스터마이징은 components/ui/에 래핑 컴포넌트 생성
        - Gluestack에 없는 도메인 컴포넌트(출퇴근 버튼, GPS 인디케이터)는 components/features/ 구현

        [네비게이션]
        - Expo Router(파일 기반 라우팅) 사용; react-navigation API 직접 사용 금지
        - 인증 흐름: app/(auth)/, 메인 앱: app/(tabs)/ 그룹 구조 유지

        [인증]
        - JWT는 Expo SecureStore에 저장; AsyncStorage 저장 절대 금지

        [GPS 및 위치]
        - 출근 체크 전 반드시 위치 권한 확인 로직 포함
        - GPS 반경 판정은 packages/shared/src/utils/gps.ts 유틸 사용 (앱 내 중복 구현 금지)
        - 위치 정확도: Accuracy.Balanced 이상 사용; 배터리 절약을 위해 백그라운드 추적 금지

        [Push 알림]
        - Expo Notifications 사용; 디바이스 토큰은 로그인 시 API 서버에 등록
        - Foreground/Background 핸들러 분리 여부 확인

        [상태 관리]
        - 서버 데이터: TanStack Query (gcTime 충분히 설정하여 오프라인 대응)
        - UI 전역 상태: Zustand

        [공유 패키지]
        - Zod 스키마: packages/shared에서 import; 앱 내 별도 정의 금지
        - API 타입: packages/shared/src/types/api/에서 import

    - path: "apps/mobile/**/*.ts"
      instructions: |
        모바일 TypeScript 코드 리뷰 기준:
        - any 타입 사용 자제
        - 공유 유틸은 packages/shared에서 import; 중복 구현 금지

    - path: "packages/database/prisma/schema.prisma"
      instructions: |
        Prisma 스키마 리뷰 기준:
        - 소프트 딜리트 대상 모델에 deletedAt DateTime? 필드 포함 여부 확인
        - 마이그레이션 안전성: 기존 데이터 손실 위험이 없는지 확인
        - 인덱스: 자주 조회되는 필드(외래키, 복합 조건)에 @@index 적용 여부
        - 관계 정합성: 올바른 onDelete/onUpdate 정책 적용 여부
        - 모든 모델에 createdAt, updatedAt 필드 포함 여부 확인

    - path: "packages/database/prisma/migrations/**"
      instructions: |
        Prisma 마이그레이션 파일 리뷰 기준:
        - 파일명에 변경 목적이 명확히 기재되어 있는지 확인
        - DROP, ALTER COLUMN 등 데이터 손실 가능 작업 경고
        - NOT NULL 컬럼 추가 시 기존 데이터 처리 방식(DEFAULT 값 등) 확인
        - 롤백 시나리오 고려 여부

    - path: "packages/shared/src/**/*.ts"
      instructions: |
        공유 패키지 코드 리뷰 기준:
        - 새로운 타입/스키마/유틸은 반드시 packages/shared/src/index.ts에서 re-export
        - Zod 스키마에서 타입을 z.infer<>로 추출; 별도 interface/type 선언 금지
        - 순수 함수로만 구현 (사이드 이펙트 없음, 외부 의존성 없음)
        - 웹·앱·API 모두에서 사용 가능한 범용적 구현인지 확인

    - path: ".github/workflows/**/*.yml"
      instructions: |
        GitHub Actions 워크플로우 리뷰 기준:
        - 시크릿 하드코딩 금지; secrets.* 또는 vars.* 참조 사용
        - actions/* 버전 고정 (SHA 또는 semver 태그 명시)
        - pnpm 워크스페이스 명령어 형식 확인: pnpm --filter @ilgam/<app> <command>
        - develop 브랜치와 main 브랜치 보호 규칙 일치 여부 확인

    - path: "packages/database/prisma/seed.ts"
      instructions: |
        시드 파일 리뷰 기준:
        - 개발/테스트 전용 데이터만 포함; 실제 사용자 데이터 포함 금지
        - upsert 사용으로 멱등성 보장 여부 확인 (중복 실행 안전)

  tools:
    # TypeScript / JavaScript
    eslint:
      enabled: true
    oxc:
      enabled: true
    biome:
      enabled: false

    # 보안 스캐닝
    gitleaks:
      enabled: true
    trufflehog:
      enabled: true
    semgrep:
      enabled: true
    trivy:
      enabled: true

    # DB / Prisma
    prismaLint:
      enabled: true

    # 인프라 / DevOps
    actionlint:
      enabled: true
    hadolint:
      enabled: true
    shellcheck:
      enabled: true
    dotenvLint:
      enabled: true

    # 문서 / 마크업
    markdownlint:
      enabled: true
    yamllint:
      enabled: true

    # CI 연동
    github-checks:
      enabled: true
      timeout_ms: 300000

    # 사용하지 않는 언어/프레임워크 비활성화
    rubocop:
      enabled: false
    phpstan:
      enabled: false
    phpmd:
      enabled: false
    phpcs:
      enabled: false
    brakeman:
      enabled: false
    swiftlint:
      enabled: false
    clang:
      enabled: false
    cppcheck:
      enabled: false
    ruff:
      enabled: false
    flake8:
      enabled: false
    pylint:
      enabled: false
    golangci-lint:
      enabled: false
    clippy:
      enabled: false
    pmd:
      enabled: false
    fbinfer:
      enabled: false
    detekt:
      enabled: false
    buf:
      enabled: false
    regal:
      enabled: false
    tflint:
      enabled: false
    checkov:
      enabled: false

  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: true

chat:
  auto_reply: true

knowledge_base:
  opt_out: false
  web_search:
    enabled: true
  code_guidelines:
    enabled: true
    filePatterns:
      - "CLAUDE.md"
      - "apps/api/CLAUDE.md"
      - "apps/web/CLAUDE.md"
      - "apps/mobile/CLAUDE.md"
      - "docs/stack.md"
      - "docs/SPEC.md"
  learnings:
    scope: local
  issues:
    scope: local
  pull_requests:
    scope: local

code_generation:
  docstrings:
    language: "ko-KR"
    path_instructions:
      - path: "apps/api/src/**/*.ts"
        instructions: "JSDoc 형식으로 작성. @param, @returns 태그 포함. 한국어로 작성."
  unit_tests:
    path_instructions:
      - path: "apps/api/src/**/*.ts"
        instructions: "Jest와 NestJS TestingModule 사용. PrismaService는 mockDeep<PrismaClient>()로 모킹."
      - path: "apps/web/**/*.tsx"
        instructions: "Vitest와 React Testing Library 사용. API 호출은 msw로 모킹. 테스트 파일은 대상 파일 옆에 코로케이션."
      - path: "apps/mobile/**/*.tsx"
        instructions: "Vitest와 React Testing Library(React Native용) 사용. 네이티브 API는 apps/mobile/__mocks__/ 설정 사용. 테스트 파일은 대상 파일 옆에 코로케이션."
