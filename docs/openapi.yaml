openapi: 3.1.0

info:
  title: 일감 API
  version: 0.1.0
  description: 단일 조직 스케줄 운영 SaaS MVP API

servers:
  - url: http://localhost:3001/api
    description: Local development

tags:
  - name: Auth
    description: 회원가입, 로그인, 토큰 갱신, 현재 사용자 조회
  - name: Organization
    description: 단일 조직 생성, 조회, 수정
  - name: Workers
    description: 인력 관리
  - name: Availability
    description: 인력별 가능 시간 관리
  - name: StaffingRules
    description: 최소 인원 조건 관리
  - name: Schedules
    description: 스케줄 추천, DRAFT 조정, 확정
  - name: ScheduleHistory
    description: 확정 스케줄 이력과 CSV export
  - name: Dashboard
    description: 조직 정보와 최근 확정 스케줄 조회

paths:
  /auth/signup:
    post:
      tags:
        - Auth
      summary: 회원가입
      description: 새 계정을 생성하고 로그인 상태로 전환합니다.
      operationId: signup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthSignupRequest"
      responses:
        "201":
          description: 회원가입 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          description: 이미 가입된 이메일
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      tags:
        - Auth
      summary: 로그인
      description: 이메일과 비밀번호로 로그인합니다.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLoginRequest"
      responses:
        "200":
          description: 로그인 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/logout:
    post:
      tags:
        - Auth
      summary: 로그아웃
      description: 현재 refresh token을 폐기합니다.
      operationId: logout
      security:
        - cookieAuth: []
      responses:
        "204":
          description: 로그아웃 성공
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/refresh:
    post:
      tags:
        - Auth
      summary: 토큰 갱신
      description: HTTP-only cookie의 refresh token으로 세션을 갱신합니다.
      operationId: refreshSession
      security:
        - cookieAuth: []
      responses:
        "200":
          description: 토큰 갱신 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/me:
    get:
      tags:
        - Auth
      summary: 현재 사용자 조회
      description: 로그인된 사용자와 조직 요약 정보를 조회합니다.
      operationId: getMe
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 현재 사용자 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /organization:
    post:
      tags:
        - Organization
      summary: 조직 생성
      description: MVP에서 계정당 하나의 조직만 생성할 수 있습니다.
      operationId: createOrganization
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganizationRequest"
      responses:
        "201":
          description: 조직 생성 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: 이미 조직이 존재함
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    get:
      tags:
        - Organization
      summary: 조직 조회
      operationId: getOrganization
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 조직 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      tags:
        - Organization
      summary: 조직 수정
      operationId: updateOrganization
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrganizationRequest"
      responses:
        "200":
          description: 조직 수정 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: refreshToken

  responses:
    ValidationError:
      description: 요청 값 검증 실패
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: 인증 실패
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: 리소스를 찾을 수 없음
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    ErrorResponse:
      type: object
      required:
        - statusCode
        - errorCode
        - message
      properties:
        statusCode:
          type: integer
          example: 400
        errorCode:
          type: string
          enum:
            - VALIDATION_ERROR
            - UNAUTHORIZED
            - FORBIDDEN
            - NOT_FOUND
            - CONFLICT
            - DUPLICATE_EMAIL
            - ORGANIZATION_REQUIRED
            - ORGANIZATION_ALREADY_EXISTS
            - WORKER_NOT_FOUND
            - SCHEDULE_NOT_FOUND
            - DRAFT_ALREADY_EXISTS
            - NO_ACTIVE_PLANNING_PERIOD
            - INVALID_TIME_RANGE
            - CLOSED_DAY
          example: VALIDATION_ERROR
        message:
          type: string
          example: 요청 값이 올바르지 않습니다

    User:
      type: object
      required:
        - id
        - email
        - name
      properties:
        id:
          type: string
          example: "1"
        email:
          type: string
          format: email
          example: owner@example.com
        name:
          type: string
          example: 홍길동

    AuthSignupRequest:
      type: object
      required:
        - name
        - email
        - password
        - passwordConfirm
      properties:
        name:
          type: string
          example: 홍길동
        email:
          type: string
          format: email
          example: owner@example.com
        password:
          type: string
          format: password
          example: password123
        passwordConfirm:
          type: string
          format: password
          example: password123

    AuthLoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: owner@example.com
        password:
          type: string
          format: password
          example: password123

    AuthSessionResponse:
      type: object
      required:
        - user
        - hasOrganization
      properties:
        user:
          $ref: "#/components/schemas/User"
        hasOrganization:
          type: boolean
          example: false

    AuthMeResponse:
      type: object
      required:
        - user
        - organization
      properties:
        user:
          $ref: "#/components/schemas/User"
        organization:
          oneOf:
            - $ref: "#/components/schemas/OrganizationSummary"
            - type: "null"

    DayOfWeek:
      type: string
      enum:
        - MONDAY
        - TUESDAY
        - WEDNESDAY
        - THURSDAY
        - FRIDAY
        - SATURDAY
        - SUNDAY

    OrganizationSummary:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          example: "1"
        name:
          type: string
          example: 일감 카페

    OrganizationBusinessHour:
      type: object
      required:
        - dayOfWeek
        - isClosed
        - openTime
        - closeTime
        - closesNextDay
      properties:
        id:
          type: string
          example: "1"
        dayOfWeek:
          $ref: "#/components/schemas/DayOfWeek"
        isClosed:
          type: boolean
          example: false
        openTime:
          type:
            - string
            - "null"
          pattern: "^\\d{2}:\\d{2}$"
          example: "09:00"
        closeTime:
          type:
            - string
            - "null"
          pattern: "^\\d{2}:\\d{2}$"
          example: "18:00"
        closesNextDay:
          type: boolean
          example: false

    OrganizationDetail:
      allOf:
        - $ref: "#/components/schemas/OrganizationSummary"
        - type: object
          required:
            - businessHours
          properties:
            businessHours:
              type: array
              items:
                $ref: "#/components/schemas/OrganizationBusinessHour"

    CreateOrganizationRequest:
      type: object
      required:
        - name
        - businessHours
      properties:
        name:
          type: string
          example: 일감 카페
        businessHours:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/OrganizationBusinessHour"

    UpdateOrganizationRequest:
      type: object
      properties:
        name:
          type: string
          example: 일감 본점
        businessHours:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/OrganizationBusinessHour"
