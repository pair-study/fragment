openapi: 3.1.0

info:
  title: 프래그먼트 API
  version: 0.1.0
  description: 단일 조직 근무 스케줄 관리 도구 MVP API

servers:
  - url: http://localhost:3001/api
    description: Local development

tags:
  - name: Auth
    description: 회원가입, 로그인, 토큰 갱신, 현재 사용자 조회
  - name: Organization
    description: 단일 조직 생성, 조회, 수정
  - name: Workers
    description: 인력 관리
  - name: Availability
    description: 인력별 가능 시간 관리
  - name: StaffingRules
    description: 최소 인원 조건 관리
  - name: Schedules
    description: 스케줄 추천, DRAFT 조정, 확정
  - name: ScheduleHistory
    description: 확정 스케줄 이력과 CSV export
  - name: Dashboard
    description: 조직 정보와 최근 확정 스케줄 조회

paths:
  /auth/signup:
    post:
      tags:
        - Auth
      summary: 회원가입
      description: 새 계정을 생성하고 로그인 상태로 전환합니다.
      operationId: signup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthSignupRequest"
      responses:
        "201":
          description: 회원가입 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          $ref: "#/components/responses/DuplicateEmail"

  /auth/login:
    post:
      tags:
        - Auth
      summary: 로그인
      description: 이메일과 비밀번호로 로그인합니다.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLoginRequest"
      responses:
        "200":
          description: 로그인 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/logout:
    post:
      tags:
        - Auth
      summary: 로그아웃
      description: 현재 refresh token을 폐기합니다.
      operationId: logout
      security:
        - cookieAuth: []
      responses:
        "204":
          description: 로그아웃 성공
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/refresh:
    post:
      tags:
        - Auth
      summary: 토큰 갱신
      description: HTTP-only cookie의 refresh token으로 세션을 갱신합니다.
      operationId: refreshSession
      security:
        - cookieAuth: []
      responses:
        "200":
          description: 토큰 갱신 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/me:
    get:
      tags:
        - Auth
      summary: 현재 사용자 조회
      description: 로그인된 사용자와 조직 요약 정보를 조회합니다.
      operationId: getMe
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 현재 사용자 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /organization:
    post:
      tags:
        - Organization
      summary: 조직 생성
      description: MVP에서 계정당 하나의 조직만 생성할 수 있습니다.
      operationId: createOrganization
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganizationRequest"
      responses:
        "201":
          description: 조직 생성 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/OrganizationAlreadyExists"

    get:
      tags:
        - Organization
      summary: 조직 조회
      operationId: getOrganization
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 조직 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      tags:
        - Organization
      summary: 조직 수정
      operationId: updateOrganization
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrganizationRequest"
      responses:
        "200":
          description: 조직 수정 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /organization/active-schedule-planning-period:
    get:
      tags:
        - Organization
      summary: 현재 스케줄링 기간 조회
      description: 현재 사용자의 조직에 설정된 active schedule planning period를 조회합니다.
      operationId: getActiveSchedulePlanningPeriod
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 현재 스케줄링 기간 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveSchedulePlanningPeriodResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OrganizationRequired"

    put:
      tags:
        - Organization
      summary: 현재 스케줄링 기간 저장
      description: 현재 사용자의 조직에 설정된 active schedule planning period를 생성하거나 교체합니다.
      operationId: upsertActiveSchedulePlanningPeriod
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertActiveSchedulePlanningPeriodRequest"
      responses:
        "200":
          description: 현재 스케줄링 기간 저장 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveSchedulePlanningPeriod"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OrganizationRequired"

    delete:
      tags:
        - Organization
      summary: 현재 스케줄링 기간 삭제
      operationId: deleteActiveSchedulePlanningPeriod
      security:
        - bearerAuth: []
      responses:
        "204":
          description: 현재 스케줄링 기간 삭제 성공
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OrganizationRequired"

  /availability:
    get:
      tags:
        - Availability
      summary: 가능 시간 조회
      description: 특정 근무자의 선택 기간 가능 시간을 조회합니다. 정책상 가능 시간은 최소 인원 조건이 있는 시간대에만 입력하고 추천 생성에 사용합니다. 현재 최소 인원 조건 밖에 있는 기존 가능 시간은 유효하지 않은 데이터로 보고 조회 또는 저장 과정에서 정리하며, 조건과 겹치는 구간만 남깁니다.
      operationId: listAvailability
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AvailabilityWorkerId"
        - $ref: "#/components/parameters/StartDate"
        - $ref: "#/components/parameters/EndDate"
      responses:
        "200":
          description: 가능 시간 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityListResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OrganizationRequired"
        "404":
          $ref: "#/components/responses/NotFound"

  /availability/bulk:
    put:
      tags:
        - Availability
      summary: 가능 시간 일괄 저장
      description: 선택 범위의 특정 근무자 가능 시간을 요청값으로 전체 교체합니다. 저장 가능한 시간은 조직 영업시간 안에 있으면서 최소 인원 조건이 있는 시간대로 제한합니다. 현재 최소 인원 조건과 겹치는 구간만 저장하고, 전혀 겹치지 않는 구간은 삭제합니다.
      operationId: replaceAvailability
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceAvailabilityRequest"
      responses:
        "200":
          description: 가능 시간 일괄 저장 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityListResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OrganizationRequired"
        "404":
          $ref: "#/components/responses/NotFound"

  /workers:
    get:
      tags:
        - Workers
      summary: 근무자 목록 조회
      description: 현재 사용자의 조직에 속한 근무자 목록을 사번 오름차순으로 조회합니다.
      operationId: listWorkers
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 근무자 목록 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkersListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OrganizationRequired"

    post:
      tags:
        - Workers
      summary: 근무자 생성
      description: 사번은 서버가 W-0001 형식으로 자동 생성합니다.
      operationId: createWorker
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkerRequest"
      responses:
        "201":
          description: 근무자 생성 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Worker"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OrganizationRequired"

  /workers/{workerId}:
    patch:
      tags:
        - Workers
      summary: 근무자 수정
      operationId: updateWorker
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkerId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWorkerRequest"
      responses:
        "200":
          description: 근무자 수정 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Worker"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OrganizationRequired"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags:
        - Workers
      summary: 근무자 삭제
      description: 근무자를 삭제합니다. 과거 스케줄 배정 기록의 worker_id는 null로 처리됩니다.
      operationId: deleteWorker
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkerId"
      responses:
        "204":
          description: 근무자 삭제 성공
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OrganizationRequired"
        "404":
          $ref: "#/components/responses/NotFound"

  /staffing-rules:
    get:
      tags:
        - StaffingRules
      summary: 최소 인원 조건 목록 조회
      operationId: listMinimumStaffingRules
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 최소 인원 조건 목록 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MinimumStaffingRulesListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OrganizationRequired"

    post:
      tags:
        - StaffingRules
      summary: 최소 인원 조건 생성
      description: 최소 인원 조건은 해당 요일의 조직 운영시간 안에서만 등록할 수 있습니다.
      operationId: createMinimumStaffingRule
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMinimumStaffingRuleRequest"
      responses:
        "201":
          description: 최소 인원 조건 생성 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MinimumStaffingRule"
        "400":
          $ref: "#/components/responses/MinimumStaffingRuleBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OrganizationRequired"

  /staffing-rules/{ruleId}:
    patch:
      tags:
        - StaffingRules
      summary: 최소 인원 조건 수정
      description: 수정 후의 조건도 해당 요일의 조직 운영시간 안에 있어야 합니다.
      operationId: updateMinimumStaffingRule
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RuleId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMinimumStaffingRuleRequest"
      responses:
        "200":
          description: 최소 인원 조건 수정 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MinimumStaffingRule"
        "400":
          $ref: "#/components/responses/MinimumStaffingRuleBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OrganizationRequired"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags:
        - StaffingRules
      summary: 최소 인원 조건 삭제
      operationId: deleteMinimumStaffingRule
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RuleId"
      responses:
        "204":
          description: 최소 인원 조건 삭제 성공
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OrganizationRequired"
        "404":
          $ref: "#/components/responses/NotFound"

  /schedules/recommend:
    post:
      tags:
        - Schedules
      summary: 스케줄 추천 생성
      description: 현재 active planning period, 조직 영업시간, 인력, 가능 시간, 최소 인원 조건을 기준으로 DRAFT 스케줄을 생성합니다. 최소 인원 조건은 추천 대상 시간대와 최소 필요 인원을 정의하며, 조건이 있는 시간대에서만 가능 후보 산출, 추천 배정, 미충족 판단을 수행합니다.
      operationId: recommendSchedule
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecommendScheduleRequest"
      responses:
        "201":
          description: 스케줄 추천 생성 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OrganizationRequired"
        "409":
          $ref: "#/components/responses/DraftAlreadyExists"

  /schedules/draft:
    get:
      tags:
        - Schedules
      summary: DRAFT 스케줄 조회
      operationId: getDraftSchedule
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StartDate"
        - $ref: "#/components/parameters/EndDate"
      responses:
        "200":
          description: DRAFT 스케줄 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftScheduleResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OrganizationRequired"

  /schedules/{scheduleId}/assignments:
    post:
      tags:
        - Schedules
      summary: DRAFT 스케줄 배정 추가
      operationId: createScheduleAssignment
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ScheduleId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleAssignmentInput"
      responses:
        "201":
          description: 배정 추가 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleAssignment"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OrganizationRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ScheduleConflict"

  /schedules/{scheduleId}/assignments/{assignmentId}:
    patch:
      tags:
        - Schedules
      summary: DRAFT 스케줄 배정 수정
      operationId: updateScheduleAssignment
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ScheduleId"
        - $ref: "#/components/parameters/AssignmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateScheduleAssignmentRequest"
      responses:
        "200":
          description: 배정 수정 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleAssignment"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OrganizationRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ScheduleConflict"

    delete:
      tags:
        - Schedules
      summary: DRAFT 스케줄 배정 삭제
      operationId: deleteScheduleAssignment
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ScheduleId"
        - $ref: "#/components/parameters/AssignmentId"
      responses:
        "204":
          description: 배정 삭제 성공
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OrganizationRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ScheduleConflict"

  /schedules/{scheduleId}/confirm:
    post:
      tags:
        - Schedules
      summary: DRAFT 스케줄 확정
      operationId: confirmSchedule
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ScheduleId"
      responses:
        "200":
          description: 스케줄 확정 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OrganizationRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ScheduleConflict"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: refreshToken

  responses:
    ValidationError:
      description: 요청 값 검증 실패
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            statusCode: 400
            errorCode: VALIDATION_ERROR
            message: 요청 형식이 올바르지 않습니다.
    MinimumStaffingRuleBadRequest:
      description: 요청 값 검증 실패 또는 최소 인원 조건 도메인 규칙 위반
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            validationError:
              summary: 요청 형식 오류
              value:
                statusCode: 400
                errorCode: VALIDATION_ERROR
                message: 요청 형식이 올바르지 않습니다.
            closedDay:
              summary: 휴무일 요청
              value:
                statusCode: 400
                errorCode: CLOSED_DAY
                message: 휴무일에는 최소 인원 조건을 등록할 수 없습니다.
            invalidTimeRange:
              summary: 운영시간 밖 요청
              value:
                statusCode: 400
                errorCode: INVALID_TIME_RANGE
                message: 최소 인원 조건은 조직 운영시간 안에서만 등록할 수 있습니다.
    Unauthorized:
      description: 인증 실패
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            invalidCredentials:
              summary: 로그인 인증 실패
              value:
                statusCode: 401
                errorCode: UNAUTHORIZED
                message: 이메일 또는 비밀번호가 올바르지 않습니다.
            authRequired:
              summary: 인증 필요
              value:
                statusCode: 401
                errorCode: UNAUTHORIZED
                message: 인증이 필요합니다.
            invalidToken:
              summary: 유효하지 않은 인증 토큰
              value:
                statusCode: 401
                errorCode: UNAUTHORIZED
                message: 유효하지 않은 인증 토큰입니다.
            invalidRefreshToken:
              summary: 유효하지 않은 refresh token
              value:
                statusCode: 401
                errorCode: UNAUTHORIZED
                message: Refresh token이 유효하지 않습니다.
    NotFound:
      description: 리소스를 찾을 수 없음
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            notFound:
              summary: 일반 리소스 없음
              value:
                statusCode: 404
                errorCode: NOT_FOUND
                message: 요청한 API를 찾을 수 없습니다.
            workerNotFound:
              summary: 근무자 없음
              value:
                statusCode: 404
                errorCode: WORKER_NOT_FOUND
                message: 근무자를 찾을 수 없습니다.
            scheduleNotFound:
              summary: 스케줄 없음
              value:
                statusCode: 404
                errorCode: SCHEDULE_NOT_FOUND
                message: 스케줄을 찾을 수 없습니다.
    OrganizationRequired:
      description: 조직 생성 필요
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            statusCode: 403
            errorCode: ORGANIZATION_REQUIRED
            message: 조직 생성 후 이용할 수 있습니다.
    DuplicateEmail:
      description: 이미 가입된 이메일
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            statusCode: 409
            errorCode: DUPLICATE_EMAIL
            message: 이미 사용 중인 이메일입니다.
    OrganizationAlreadyExists:
      description: 이미 조직이 존재함
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            statusCode: 409
            errorCode: ORGANIZATION_ALREADY_EXISTS
            message: 이미 조직이 존재합니다.
    DraftAlreadyExists:
      description: 같은 입력 조건의 DRAFT가 이미 존재함
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            statusCode: 409
            errorCode: DRAFT_ALREADY_EXISTS
            message: 이미 생성된 DRAFT 스케줄입니다.
    ScheduleConflict:
      description: DRAFT 상태가 아닌 스케줄
